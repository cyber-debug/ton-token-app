version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - framer-motion
      ton-toolchain:
        patterns:
          - "@ton/*"
          - "@tonconnect/*"
      server-runtime:
        patterns:
          - compression
          - cors
          - dotenv
          - express
          - "express-*"
          - helmet
          - morgan
      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - vitest
          - "@vitest/*"
      eslint-toolchain:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
      testing-toolchain:
        patterns:
          - "@testing-library/*"
          - jsdom
          - supertest
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
