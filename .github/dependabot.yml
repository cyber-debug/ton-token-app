version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # v6 requires Vite 8; VORIX currently targets the stable Vite 7 toolchain.
      - dependency-name: "@vitejs/plugin-react"
        versions:
          - ">=6 <7"
      # ESLint 10 is blocked until eslint-plugin-react declares compatibility.
      - dependency-name: "@eslint/js"
        versions:
          - ">=10 <11"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
