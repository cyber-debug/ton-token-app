name: Deploy live beta to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  configuration:
    name: Check live beta configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check backend URL
        id: check
        env:
          BETA_API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$BETA_API_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages deployment skipped. Set the VITE_API_BASE_URL repository variable to the public HTTPS backend URL."
            exit 0
          fi
          node -e "const value = new URL(process.env.BETA_API_URL); if (value.protocol !== 'https:') throw new Error('VITE_API_BASE_URL must use HTTPS');"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build live frontend
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_TON_NETWORK: ${{ vars.VITE_TON_NETWORK || 'testnet' }}
      VITE_DEMO_MODE: false
      VITE_ROUTER_MODE: hash
      VITE_TONCONNECT_MANIFEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tonconnect-manifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and test
        run: npm run lint && npm test

      - name: Generate deployment manifest
        run: npm run manifest:generate

      - name: Build live beta
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy live frontend
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
